name: build-pc

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pc/**'
      - '.github/workflows/build-pc.yml'
  pull_request:
    paths:
      - 'pc/**'
  workflow_dispatch:

jobs:
  build:
    name: 编译 Windows 端（.NET 7）
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: 编译（Release）
        run: dotnet build "pc/DOUY.Pc/DOUY.Pc.csproj" -c Release --nologo

      - name: 冒烟测试 —— 无界面模式能否启动并监听
        shell: pwsh
        run: |
          $env:DOTNET_CLI_UI_LANGUAGE = "en"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $exe = "pc/DOUY.Pc/bin/Release/net7.0-windows/DOUY.Pc.exe"
          $port = 19351
          $p = Start-Process -FilePath $exe -ArgumentList @("serve", "--port", "$port", "--phone", "127.0.0.1:28767") `
                             -RedirectStandardOutput "pc.log" -RedirectStandardError "pc.err.log" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if ($p.HasExited) { Get-Content pc.log -Encoding UTF8; Get-Content pc.err.log -Encoding UTF8; throw "PC 端启动即退出" }

          # 用「端口是否在监听」判定，避免依赖日志里的中文（CI 控制台编码不可控）
          $listening = $false
          for ($i = 0; $i -lt 20; $i++) {
            $client = New-Object System.Net.Sockets.TcpClient
            try {
              $client.Connect("127.0.0.1", $port)
              $listening = $client.Connected
            } catch { $listening = $false } finally { $client.Dispose() }
            if ($listening) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content pc.log -Encoding UTF8 | Select-Object -First 15
          if (-not $listening) { Get-Content pc.err.log -Encoding UTF8; throw "端口 $port 未监听，PC 端没有起来" }
          Stop-Process -Id $p.Id -Force
          Write-Host "冒烟测试通过：RTMP 端口 $port 已在监听"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DOUY.Pc-win64
          path: pc/DOUY.Pc/bin/Release/net7.0-windows/
          if-no-files-found: error
          retention-days: 30
